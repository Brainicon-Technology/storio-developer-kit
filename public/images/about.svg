<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Classroom illustration">
  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect y="520" width="1200" height="155" fill="#e8dcc4"/>
  <!-- board -->
  <rect x="240" y="90" width="720" height="320" rx="12" fill="#0e704b" stroke="#7c5a3c" stroke-width="14"/>
  <g stroke="#e6f4ee" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M300 170 h220"/>
    <path d="M300 220 h300"/>
    <path d="M300 270 h180"/>
    <circle cx="800" cy="230" r="70"/>
    <path d="M730 230 h140 M800 160 v140"/>
  </g>
  <rect x="560" y="410" width="80" height="14" fill="#7c5a3c"/>
  <!-- books -->
  <g>
    <rect x="140" y="440" width="30" height="80" fill="#d97706"/>
    <rect x="172" y="430" width="26" height="90" fill="#0e704b"/>
    <rect x="200" y="450" width="32" height="70" fill="#1f2937"/>
  </g>
  <!-- desks -->
  <g fill="#c9a77c" stroke="#7c5a3c" stroke-width="4">
    <rect x="300" y="480" width="200" height="22"/>
    <rect x="700" y="480" width="200" height="22"/>
  </g>
  <g stroke="#7c5a3c" stroke-width="8">
    <line x1="320" y1="502" x2="320" y2="590"/>
    <line x1="480" y1="502" x2="480" y2="590"/>
    <line x1="720" y1="502" x2="720" y2="590"/>
    <line x1="880" y1="502" x2="880" y2="590"/>
  </g>
  <!-- globe -->
  <circle cx="1030" cy="440" r="50" fill="#bfe3cf" stroke="#0e704b" stroke-width="6"/>
  <path d="M990 430 q40 -30 80 0 M995 460 q35 20 70 0" stroke="#0e704b" stroke-width="5" fill="none"/>
  <rect x="1022" y="490" width="16" height="30" fill="#7c5a3c"/>
</svg>
